<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberSafe | Student Login</title><style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: white;
    width: 100%;
    max-width: 420px;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 20px #10234420;
}

h2 {
    text-align: center;
    color: #102344;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 12px 0 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 22px;
    background: #102344;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

.links {
    text-align: center;
    margin-top: 20px;
}

a {
    color: #087e83;
    text-decoration: none;
    font-weight: bold;
}

#message {
    text-align: center;
    margin-top: 15px;
}
</style></head><body><div class="container"><h2>🛡️ CyberSafe</h2><p class="subtitle">Welcome Back! Login to Continue</p><form id="loginForm"><label>Email Address</label>
<input type="email" id="email"
placeholder="Enter your email" required>

<label>Password</label>
<input type="password" id="password"
placeholder="Enter your password" required>

<button type="submit">Login</button>

</form><div id="message"></div><div class="links">
<p>Don't have an account?</p>
<a href="register.html">Create Account</a>
<br><br>
<a href="index.html">Back to Home</a>
</div></div><script>
document.getElementById("loginForm")
.addEventListener("submit", function(event) {
    event.preventDefault();

    document.getElementById("message").textContent =
    "Login interface ready. Account authentication will be connected through Firebase.";

});
</script></body>
  </html>
