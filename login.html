<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CyberSafe | Student Login</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: white;
    width: 100%;
    max-width: 420px;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 20px #10234420;
}

h2 {
    text-align: center;
    color: #102344;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 12px 0 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 22px;
    background: #102344;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    font-weight: bold;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.links {
    text-align: center;
    margin-top: 20px;
}

a {
    color: #087e83;
    text-decoration: none;
    font-weight: bold;
}

#message {
    text-align: center;
    margin-top: 15px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="container">

<h2>🛡️ CyberSafe</h2>

<p class="subtitle">Welcome Back! Login to Continue</p>

<form id="loginForm">

<label>Email Address</label>
<input
    type="email"
    id="email"
    placeholder="Enter your email"
    required
>

<label>Password</label>
<input
    type="password"
    id="password"
    placeholder="Enter your password"
    required
>

<button type="submit" id="loginButton">
    Login
</button>

</form>

<div id="message" aria-live="polite"></div>

<div class="links">
    <p>Don't have an account?</p>
    <a href="register.html">Create Account</a>
    <br><br>
    <a href="index.html">Back to Home</a>
</div>

</div>

<script type="module">

// FIREBASE IMPORTS

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";


// FIREBASE CONFIGURATION

const firebaseConfig = {
    apiKey: "AIzaSyBLi7Rjgud2UWyCo_VfoIjr5kcDzp5CxKc",
    authDomain: "cybersafe-awareness.firebaseapp.com",
    projectId: "cybersafe-awareness",
    storageBucket: "cybersafe-awareness.firebasestorage.app",
    messagingSenderId: "364841124280",
    appId: "1:364841124280:web:e3e86e02e6e967d039cf4d"
};


// INITIALIZE FIREBASE

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


// GET FORM ELEMENTS

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");


// DISPLAY MESSAGE

function showMessage(text, color) {
    message.style.color = color;
    message.textContent = text;
}


// STUDENT LOGIN

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Logging in...";

    showMessage("Checking your account...", "#087e83");

    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        showMessage(
            "Login successful! Opening your dashboard...",
            "green"
        );

        setTimeout(function() {
            window.location.href = "dashboard.html";
        }, 1500);

    } catch (error) {

        console.error("CyberSafe Login Error:", error);

        if (
            error.code === "auth/invalid-credential" ||
            error.code === "auth/user-not-found" ||
            error.code === "auth/wrong-password"
        ) {
            showMessage(
                "Incorrect email or password. Please try again.",
                "red"
            );

        } else if (error.code === "auth/invalid-email") {

            showMessage(
                "Please enter a valid email address.",
                "red"
            );

        } else if (error.code === "auth/too-many-requests") {

            showMessage(
                "Too many attempts. Please try again later.",
                "red"
            );

        } else {

            showMessage(
                "Login failed: " + error.message,
                "red"
            );
        }

    } finally {

        button.disabled = false;
        button.textContent = "Login";

    }

});

</script>

</body>
</html>
