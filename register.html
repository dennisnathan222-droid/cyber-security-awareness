<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CyberSafe | Student Registration</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #17243b;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: white;
    width: 100%;
    max-width: 450px;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 20px #10234420;
}

h2 {
    text-align: center;
    color: #102344;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 12px 0 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    background: #102344;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #126b80;
}

.links {
    text-align: center;
    margin-top: 20px;
}

.links a {
    color: #087e83;
    text-decoration: none;
    font-weight: bold;
}

#message {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h2>🛡️ CyberSafe</h2>

<p class="subtitle">Create Your Student Account</p>

<form id="registerForm">

<label>Full Name</label>
<input type="text" id="name" placeholder="Enter your full name" required>

<label>Email Address</label>
<input type="email" id="email" placeholder="Enter your email" required>

<label>Username</label>
<input type="text" id="username" placeholder="Choose a username" required>

<label>Password</label>
<input type="password" id="password" placeholder="Create a password" minlength="8" required>

<label>Confirm Password</label>
<input type="password" id="confirmPassword" placeholder="Confirm your password" required>

<button type="submit">Create Account</button>

</form>

<div id="message" aria-live="polite"></div>

<div class="links">
<p>Already have an account?</p>
<a href="login.html">Login Here</a>
<br><br>
<a href="index.html">Back to Home</a>
</div>

</div>

<script>
document.getElementById("registerForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    const message = document.getElementById("message");

    if (password !== confirmPassword) {
        message.style.color = "red";
        message.textContent = "Passwords do not match!";
        return;
    }

    message.style.color = "#087e83";
    message.textContent = "Registration form validated!";

});
</script>

</body>
</html>
