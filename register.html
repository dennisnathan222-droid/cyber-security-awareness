<title>CyberSafe | Student Registration</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #17243b;

    padding: 20px;
}

.container {
    background: white;

}

h2 {
    text-align: center;
    color: #102344;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;

}

label {
    display: block;
    margin: 12px 0 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    background: #102344;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #126b80;
}

.links {
    text-align: center;
    margin-top: 20px;
}

.links a {
    color: #087e83;
    text-decoration: none;
    font-weight: bold;
}

#message {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}
</style>
</head>
