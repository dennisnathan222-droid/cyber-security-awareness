    const lesson = lessons[current - 1];

        lesson.tip;

    document.getElementById("takeaway").textContent =
        lesson.takeaway;

    document.getElementById("status").textContent =
        localStorage.getItem("cyberLesson" + current) === "completed"
        ? "✓ You have completed this lesson."

    localStorage.setItem("cyberLesson" + current, "completed");

    if (current > 1) {
